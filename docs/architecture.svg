<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1010" width="1060" height="1010" role="img" aria-labelledby="title desc">
  <title id="title">The model teaches, code keeps score, tools verify</title>
  <desc id="desc">Architecture of Redefluss. Book pages go through ingestion into a curriculum store, which gives the planner lessons and items. Intake and diagnostics give the learner model a profile and baseline. The learner model tells the planner what you know; the planner gives the tutor, one frontier model with tools, a plan for today. The tutor works with you, verifies answers with checkers (LanguageTool, a noun lexicon, a verb-position check) and logs every attempt to the learner model. Planned, not built yet: two-pass ingestion, an examiner calibrated by humans that sends scores to the learner model, and a speech pipeline that sends speech evidence to the examiner.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#7a7a7a"/>
    </marker>
    <style>
      .box { fill: #121212; stroke: #3d3d3d; stroke-width: 1.5; }
      .planned { stroke-dasharray: 7 5; stroke: #5a5a5a; fill: #0d0d0d; }
      .core { fill: #121a2b; stroke: #4f86f7; stroke-width: 2.5; }
      .name { fill: #f2f2f2; font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
      .sub { fill: #bdbdbd; font: 400 14.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
      .tag { fill: #8c8c8c; font: 500 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: end; letter-spacing: 0.06em; }
      .label { fill: #c8c8c8; font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .edge { fill: none; stroke: #7a7a7a; stroke-width: 1.5; }
      .edge.later { stroke-dasharray: 6 5; }
      .heading { fill: #f5f5f5; font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .legend { fill: #a8a8a8; font: 400 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1060" height="1010" fill="#0a0a0a"/>
  <text class="heading" x="66" y="34">The model teaches, code keeps score, tools verify</text>

  <!-- Edges first, so boxes sit on top. -->
  <path class="edge later" d="M194.5 165 V217" marker-end="url(#arrow)"/>
  <path class="edge later" d="M194.5 315 V368" marker-end="url(#arrow)"/>
  <path class="edge" d="M521.5 165 V368" marker-end="url(#arrow)"/>
  <text class="label" x="533" y="273">profile, baseline</text>
  <path class="edge later" d="M849.5 165 V368" marker-end="url(#arrow)"/>
  <text class="label" x="861" y="273">calibrate</text>
  <path class="edge later" d="M721 407 H653" marker-end="url(#arrow)"/>
  <text class="label" x="662" y="394">scores</text>
  <path class="edge" d="M521.5 466 V518" marker-end="url(#arrow)"/>
  <text class="label" x="533" y="501">what you know</text>
  <path class="edge" d="M194.5 466 V568 H391" marker-end="url(#arrow)"/>
  <text class="label" x="211" y="557">lessons, items</text>
  <path class="edge" d="M521.5 616 V668" marker-end="url(#arrow)"/>
  <text class="label" x="533" y="650">plan for today</text>
  <path class="edge" d="M651 690 H686 V435 H653" marker-end="url(#arrow)"/>
  <text class="label" x="697" y="568">logs every</text>
  <text class="label" x="697" y="590">attempt</text>
  <path class="edge" d="M325 718 H391" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="337" y="707">verify</text>
  <path class="edge" d="M653 718 H719" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="edge later" d="M849.5 766 V819" marker-end="url(#arrow)"/>
  <path class="edge later" d="M978 868 H1010 V418 H980" marker-end="url(#arrow)"/>
  <text class="label" x="998" y="584" text-anchor="end">speech evidence</text>

  <!-- Row 1 -->
  <rect class="box" x="66" y="69" width="257" height="96" rx="8"/>
  <text class="name" x="194.5" y="101">Book pages</text>
  <text class="sub" x="194.5" y="126">photos and PDFs</text>
  <text class="sub" x="194.5" y="147">of your textbook</text>

  <rect class="box" x="393" y="69" width="258" height="96" rx="8"/>
  <text class="name" x="521.5" y="101">Intake + diagnostics</text>
  <text class="sub" x="521.5" y="126">level, languages, exam,</text>
  <text class="sub" x="521.5" y="147">hours, week-0 scores</text>

  <rect class="box" x="721" y="69" width="257" height="96" rx="8"/>
  <text class="name" x="849.5" y="101">Humans</text>
  <text class="sub" x="849.5" y="126">weekly tutor,</text>
  <text class="sub" x="849.5" y="147">monthly rater</text>

  <!-- Row 2 -->
  <rect class="box planned" x="66" y="219" width="257" height="96" rx="8"/>
  <text class="tag" x="311" y="234">PLANNED</text>
  <text class="name" x="194.5" y="251">Ingestion</text>
  <text class="sub" x="194.5" y="276">two extractions + diff,</text>
  <text class="sub" x="194.5" y="297">you confirm conflicts</text>

  <!-- Row 3 -->
  <rect class="box" x="66" y="370" width="257" height="96" rx="8"/>
  <text class="name" x="194.5" y="402">Curriculum store</text>
  <text class="sub" x="194.5" y="427">lessons, items, keys,</text>
  <text class="sub" x="194.5" y="448">provenance flags</text>

  <rect class="box core" x="393" y="370" width="258" height="96" rx="8"/>
  <text class="name" x="521.5" y="402">Learner model</text>
  <text class="sub" x="521.5" y="427">mastery ladder, words,</text>
  <text class="sub" x="521.5" y="448">errors, objective scores</text>

  <rect class="box planned" x="721" y="370" width="257" height="96" rx="8"/>
  <text class="tag" x="966" y="385">PLANNED</text>
  <text class="name" x="849.5" y="402">Examiner</text>
  <text class="sub" x="849.5" y="427">separate context,</text>
  <text class="sub" x="849.5" y="448">rubric + rated anchors</text>

  <!-- Row 4 -->
  <rect class="box" x="393" y="520" width="258" height="96" rx="8"/>
  <text class="name" x="521.5" y="552">Planner</text>
  <text class="sub" x="521.5" y="577">rules choose what</text>
  <text class="sub" x="521.5" y="598">you study today</text>

  <!-- Row 5 -->
  <rect class="box" x="66" y="670" width="257" height="96" rx="8"/>
  <text class="name" x="194.5" y="702">Checkers</text>
  <text class="sub" x="194.5" y="727">LanguageTool, lexicon,</text>
  <text class="sub" x="194.5" y="748">verb-position check</text>

  <rect class="box" x="393" y="670" width="258" height="96" rx="8"/>
  <text class="name" x="521.5" y="702">Tutor</text>
  <text class="sub" x="521.5" y="727">one frontier model</text>
  <text class="sub" x="521.5" y="748">with tools</text>

  <rect class="box" x="721" y="670" width="257" height="96" rx="8"/>
  <text class="name" x="849.5" y="702">You</text>
  <text class="sub" x="849.5" y="727">attempts, speech,</text>
  <text class="sub" x="849.5" y="748">writing</text>

  <!-- Row 6 -->
  <rect class="box planned" x="721" y="821" width="257" height="96" rx="8"/>
  <text class="tag" x="966" y="836">PLANNED</text>
  <text class="name" x="849.5" y="853">Speech pipeline</text>
  <text class="sub" x="849.5" y="878">2 transcribers, fluency,</text>
  <text class="sub" x="849.5" y="899">pronunciation scores</text>

  <!-- Legend -->
  <rect class="box" x="66" y="958" width="34" height="20" rx="4"/>
  <text class="legend" x="110" y="973">built</text>
  <rect class="box planned" x="166" y="958" width="34" height="20" rx="4"/>
  <text class="legend" x="210" y="973">planned, not built yet</text>
</svg>
